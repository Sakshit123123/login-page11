<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login / Create Account</title>
  <style>
    body { 
      font-family: Arial, sans-serif; 
      background: #f4f6f9; 
      margin: 0; 
      padding: 0; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      height: 100vh; 
    }
    .container {
      background: white;
      padding: 20px 30px;
      border-radius: 10px;
      box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
      width: 350px;
    }
    h2 { text-align: center; margin-bottom: 20px; color: #2c3e50; }
    label { font-weight: bold; display: block; margin-top: 10px; }
    input {
      width: 100%; padding: 10px; margin-top: 5px; 
      border: 1px solid #ccc; border-radius: 5px;
    }
    button {
      width: 100%; padding: 10px; margin-top: 15px;
      border: none; border-radius: 5px; cursor: pointer;
      background: #2980b9; color: white; font-size: 16px;
    }
    button:hover { background: #3498db; }
    .switch {
      text-align: center; margin-top: 15px; font-size: 14px;
    }
    .switch a { color: #2980b9; text-decoration: none; font-weight: bold; }
  </style>
</head>
<body>
  <div class="container">
    <!-- Login Form -->
    <div id="loginForm">
      <h2>Login</h2>
      <form>
        <label>Email</label>
        <input type="email" required>
        
        <label>Password</label>
        <input type="password" required>
        
        <button type="submit">Login</button>
      </form>
      <div class="switch">
        Don’t have an account? <a href="#" onclick="showSignup()">Create Account</a>
      </div>
    </div>

    <!-- Signup Form -->
    <div id="signupForm" style="display:none;">
      <h2>Create Account</h2>
      <form onsubmit="return showLoginPage(event)">
        <label>Full Name</label>
        <input type="text" required>
        
        <label>Email</label>
        <input type="email" required>
        
        <label>Mobile Number</label>
        <input type="tel" pattern="[0-9]{10}" placeholder="10-digit number" required>
        
        <label>Password</label>
        <input type="password" required>
        
        <label>Confirm Password</label>
        <input type="password" required>
        
        <button type="submit">Sign Up</button>
      </form>
      <div class="switch">
        Already have an account? <a href="#" onclick="showLogin()">Login</a>
      </div>
    </div>
  </div>

  <script>
    function showSignup() {
      document.getElementById("loginForm").style.display = "none";
      document.getElementById("signupForm").style.display = "block";
    }
    function showLogin() {
      document.getElementById("signupForm").style.display = "none";
      document.getElementById("loginForm").style.display = "block";
    }
    function showLoginPage(e) {
      e.preventDefault();
      alert("Account created successfully! Please login.");
      showLogin();
      return false;
    }
  </script>
</body>
</html>
